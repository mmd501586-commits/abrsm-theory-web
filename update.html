<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>更新乐理小练习</title>
<style>
body{margin:0;padding:24px;background:#f5f3ed;color:#173e37;font:17px/1.7 system-ui,sans-serif}main{max-width:520px;margin:8vh auto;background:#fffef9;border:1px solid #ddd;padding:24px;border-radius:20px}h1{font-size:25px;line-height:1.4}button,a{font:inherit}button{padding:12px 18px;border-radius:12px;border:1px solid #31594e;background:#17483d;color:white;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:transparent;color:#17483d}p{overflow-wrap:anywhere}.small{font-size:14px;color:#50655d}.actions{display:flex;gap:12px;flex-wrap:wrap}#status{min-height:3.4em}
</style>
<main>
<h1>更新乐理小练习</h1>
<p>这个入口用于解决手机一直显示旧版的问题。更新完成后会回到原网址，继续未完成的练习。</p>
<p class="small">不清空、不重写本机学习记录。请暂停在其他标签页答题；若旧页面提示“尚未保存”，先在旧页面导出备份。</p>
<p id="records" class="small">正在检查本机记录…</p>
<p id="status" role="status" aria-live="polite">正在准备更新入口…</p>
<div class="actions"><button id="update" disabled>更新并继续练习</button><button id="backup" class="secondary" disabled>下载本机备份</button></div>
<p class="small">请使用原来保存学习记录的浏览器。记录不会上传，也不会同步到其他设备。</p>
<noscript>请允许此网站运行 JavaScript 后重试。</noscript>
</main>
<script type="module">
// The extra leading slash is a network entry outside the old worker scope.
// GitHub Pages serves the same repository; the origin and record keys stay put.
const scope = new URL(location.pathname.replace(/^\/+/, '/').replace(/update\.html$/, ''), location.origin);
const update = document.querySelector('#update');
const backup = document.querySelector('#backup');
const status = document.querySelector('#status');
const records = document.querySelector('#records');
let inspect;
let currentState;
let busy = false;
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const bounded = (promise, ms, message) => new Promise((resolve, reject) => {
  const timer = setTimeout(() => reject(new Error(message)), ms);
  promise.then(value => {clearTimeout(timer);resolve(value);}, error => {clearTimeout(timer);reject(error);});
});
async function readRecords() {
  const result = await inspect();
  const sources = result.sources.filter(source => ['indexeddb', 'localstorage'].includes(source.id));
  if (sources.some(source => ['error', 'invalid'].includes(source.status))) {
    throw new Error('暂时无法可靠读取本机记录，已停止更新。请先返回原练习页导出备份；不要清除网站数据。');
  }
  const saved = sources.filter(source => source.status === 'available').sort((a,b) => b.revision-a.revision || b.savedAt-a.savedAt);
  currentState = saved[0]?.state || null;
  backup.disabled = busy || !currentState;
  records.textContent = currentState
    ? `已读到 ${currentState.history.length} 次作答记录${currentState.activeSession && !currentState.activeSession.completed ? '，有未完成练习' : ''}。原记录保持不变。`
    : '当前浏览器没有已保存的学习记录。如果原练习页有记录，请先在那里导出备份，再使用本入口。';
  return currentState;
}
function workerVersion(worker) {
  if (!worker) return Promise.resolve(null);
  return new Promise(resolve => {
    const channel = new MessageChannel();
    const finish = value => {clearTimeout(timer);channel.port1.close();resolve(value);};
    const timer = setTimeout(() => finish(null), 1200);
    channel.port1.onmessage = event => finish(event.data?.version || null);
    try {worker.postMessage({type:'GET_RELEASE_VERSION'}, [channel.port2]);}
    catch {finish(null);}
  });
}
update.addEventListener('click', async () => {
  if (busy) return;
  busy = true; update.disabled = true; backup.disabled = true;
  try {
    if (!navigator.onLine) throw new Error('当前离线。请联网后重试，原学习记录没有改动。');
    await readRecords();
    status.textContent = '正在联网检查并下载新版，请保持本页打开…';
    const response = await fetch(new URL('precache.js', scope), {cache:'no-store'});
    if (!response.ok) throw new Error('无法取得新版，请联网后重试。');
    const match = (await response.text()).match(/^self\.__PRECACHE\s*=\s*(\{[\s\S]*\});\s*$/);
    if (!match) throw new Error('新版清单无法读取，已停止更新。');
    const version = JSON.parse(match[1]).version;
    const registration = await bounded(navigator.serviceWorker.register(new URL('sw.js', scope), {scope:scope.href, updateViaCache:'none'}), 30000, '连接更新服务超时，请重试。');
    if (registration.scope !== scope.href) throw new Error('更新范围不匹配，已停止。');
    await bounded(registration.update(), 30000, '更新检查超时，请重试。');
    const deadline = Date.now() + 150000;
    let activated = false;
    while (Date.now() < deadline) {
      const waiting = registration.waiting;
      if (waiting?.state === 'installed' && await workerVersion(waiting) === version) {
        await readRecords();
        status.textContent = '新版已准备好，正在启用；本机记录保持不变…';
        waiting.postMessage({type:'ACTIVATE_UPDATE'});
      }
      if (registration.active?.state === 'activated' && await workerVersion(registration.active) === version) {
        activated = true; break;
      }
      await sleep(250);
    }
    if (!activated) throw new Error('新版没有完整下载，暂未切换。请检查网络后重试；本机记录没有改动。');
    await readRecords();
    status.textContent = '更新成功，正在返回原网址…';
    const destination = new URL(scope);
    destination.hash = currentState?.activeSession && !currentState.activeSession.completed ? 'session' : 'home';
    location.replace(destination.href);
  } catch (error) {
    status.textContent = error.message || '更新未完成，请重试。原记录没有改动。';
    busy = false; update.disabled = false; backup.disabled = !currentState;
  }
});
backup.addEventListener('click', async () => {
  try {
    await readRecords();
    if (!currentState) return;
    const data = {format:'abrsm-theory-progress',version:1,exportedAt:new Date().toISOString(),state:currentState};
    const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}));
    const link = document.createElement('a');link.href=url;link.download='learning-backup-before-update.json';link.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    status.textContent = '已生成本机备份。现在可以更新并继续练习。';
  } catch (error) {status.textContent = error.message;}
});
try {
  if (!('serviceWorker' in navigator) || !window.isSecureContext) throw new Error('请在原来的浏览器中打开 HTTPS 更新链接。');
  ({inspectStoredProgress:inspect} = await import(new URL('storage.js', scope).href));
  await readRecords();
  status.textContent = '已从网络打开更新入口。点击下方按钮更新，无需做完练习。';
  update.disabled = false;
} catch (error) {status.textContent = error.message || '更新入口未能加载，请联网后重试。';}
</script>
</html>
